name: CI Build
on:
  push:
  release:
    types: [published]

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 256M
  CCACHE_COMPRESS: true
  ESP_IDF_VERSION: v6.1
  TEST_TARGET: esp32s3

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: spinach-release
            platform: spinach
            target: esp32s3
            ud_debug: 0
          - environment: spinach-debug
            platform: spinach
            target: esp32s3
            ud_debug: 1
          - environment: carrot-release
            platform: carrot
            target: esp32c6
            ud_debug: 0
          - environment: carrot-debug
            platform: carrot
            target: esp32c6
            ud_debug: 1

    env:
      # Enable verbose logging in debug artifacts for ugly duckling tags
      UD_LOG_VERBOSE: ""

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Restore ccache cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.ESP_IDF_VERSION }}-${{ matrix.target }}-${{ matrix.ud_debug }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.ESP_IDF_VERSION }}-${{ matrix.target }}-${{ matrix.ud_debug }}-

      - name: Create dummy config directory
        run: |
          mkdir -p config
          echo "{}" > config/network-config.json

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          esp_idf_docker_image: lptr/esp-idf-clang
          target: ${{ matrix.target }}
          extra_docker_args: >-
            -v ${{ env.CCACHE_DIR }}:/root/.ccache
            -e IDF_CCACHE_ENABLE=1
            -e CCACHE_COMPILERCHECK=content
          command: |
            ccache --max-size=${{ env.CCACHE_MAXSIZE }} --zero-stats
            echo "::group::idf.py build"
            idf.py build \
              -DUD_DEBUG=${{ matrix.ud_debug }} \
              -DUD_LOG_VERBOSE=${{ env.UD_LOG_VERBOSE }}
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then exit $rc; fi
            esp-idf-sbom create -o build/ugly-duckling.spdx build/project_description.json && \
            pyspdxtools --novalidation --infile build/ugly-duckling.spdx --outfile build/ugly-duckling.spdx.json && \
            ccache -s

      - name: Show binary sizes
        run: |
          {
            echo "### Binary sizes — ${{ matrix.environment }}"
            echo
            echo '| File | Size |'
            echo '| --- | ---: |'
            for f in build/*.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin; do
              [ -f "$f" ] || continue
              size=$(stat -c '%s' "$f")
              printf '| `%s` | %s B (%s) |\n' "$f" "$size" "$(numfmt --to=iec-i --suffix=B --format='%.1f' "$size")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l build/*.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin

      - name: Check for float-to-string bloat
        run: |
          if grep -q 'floating_to_chars\.o' build/ugly-duckling.map; then
            echo "::error::floating_to_chars.o (~123 KB) is linked: something calls std::to_string/std::to_chars on a float or double. See docs/CodingStandards.md#binary-size"
            grep -n -A1 'floating_to_chars\.o' build/ugly-duckling.map | head -20
            exit 1
          fi

      - name: clang-format
        if: matrix.ud_debug == 0
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          esp_idf_docker_image: lptr/esp-idf-clang
          target: ${{ matrix.target }}
          command: |
            find main components -type f \( -name '*.cpp' -o -name '*.hpp' \) -not -path '*/test/*' -not -path '*/build/*' | xargs clang-format -i
            git diff --exit-code --stat || { echo "::error::Files above need clang-format. Run: find main components -name '*.cpp' -o -name '*.hpp' | xargs clang-format -i"; exit 1; }

      - name: clang-tidy
        if: matrix.ud_debug == 0
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          esp_idf_docker_image: lptr/esp-idf-clang
          target: ${{ matrix.target }}
          command: |
            run-clang-tidy -p build/clang -header-filter="$(pwd)/(main|components)/" $(find main components -type f -name '*.cpp' -not -path '*/test/*' -not -path '*/build/*')

      - name: Save ccache cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.ESP_IDF_VERSION }}-${{ matrix.target }}-${{ matrix.ud_debug }}-${{ github.run_id }}

      - name: Collect artifacts
        run: |
          mkdir -p work/artifacts
          cp build/ugly-duckling.bin work/artifacts/ugly-duckling-${{ matrix.environment }}.bin
          cp build/ugly-duckling.elf work/artifacts/ugly-duckling-${{ matrix.environment }}.elf
          cp build/bootloader/bootloader.bin work/artifacts/bootloader-${{ matrix.environment }}.bin
          cp build/bootloader/bootloader.elf work/artifacts/bootloader-${{ matrix.environment }}.elf
          cp build/ota_data_initial.bin work/artifacts/ota_data_initial-${{ matrix.environment }}.bin
          cp build/partition_table/partition-table.bin work/artifacts/partition-table-${{ matrix.environment }}.bin
          cp partitions.csv work/artifacts/partitions-${{ matrix.environment }}.csv
          cp build/flasher_args.json work/artifacts/flasher_args-${{ matrix.environment }}.json
          cp build/ugly-duckling.spdx work/artifacts/ugly-duckling-${{ matrix.environment }}.spdx
          cp build/ugly-duckling.spdx.json work/artifacts/ugly-duckling-${{ matrix.environment }}.spdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ugly-duckling-${{ matrix.environment }}
          path: work/artifacts/
          if-no-files-found: error

  unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -G Ninja -DCMAKE_CXX_COMPILER=clang++ -S test/unit-tests -B test/unit-tests/build-native

      - name: Build Project
        run: cmake --build test/unit-tests/build-native

      - name: Run tests
        working-directory: test/unit-tests/build-native
        run: |
          ./ugly-duckling-unit-tests

  embedded-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Restore ccache cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.ESP_IDF_VERSION }}-${{ env.TEST_TARGET }}-embedded-test-${{ github.run_id }}
          restore-keys: ccache-${{ env.ESP_IDF_VERSION }}-${{ env.TEST_TARGET }}-embedded-test-

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: ${{ env.TEST_TARGET }}
          path: test/embedded-tests
          extra_docker_args: >-
            -v ${{ env.CCACHE_DIR }}:/root/.ccache
            -e IDF_CCACHE_ENABLE=1
            -e CCACHE_COMPILERCHECK=content
          command: |
            ccache --max-size=${{ env.CCACHE_MAXSIZE }} --zero-stats
            echo "::group::idf.py build"
            idf.py build
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then exit $rc; fi
            ccache -s

      - name: Run tools tests
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: ${{ env.TEST_TARGET }}
          command: python3 -m unittest discover -s tools/test -v

      - name: Run a Wokwi CI server
        uses: wokwi/wokwi-ci-server-action@v1

      - name: esp-idf test
        run: |
            docker run \
            -v .:/project \
            -v ./artifacts/pytest-logs:/logs \
            -w /project/test/embedded-tests \
            -e HOME=/tmp \
            --add-host=host.docker.internal:host-gateway \
            -e WOKWI_CLI_SERVER=ws://host.docker.internal:9177 \
            -e WOKWI_CLI_TOKEN=${{ secrets.WOKWI_CLI_TOKEN }} \
            lptr/pytest-embedded:latest \
            pytest \
              --embedded-services idf,wokwi \
              --root-logdir /logs \
              ./pytest_embedded-tests.py \
              --wokwi-timeout=120000

      - name: Upload pytest-embedded logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-embedded-logs
          path: |
            artifacts/pytest-logs/**
          if-no-files-found: warn

  e2e-test:
    runs-on: ubuntu-latest

    env:
      HOSTNAME: ""

    steps:
      - uses: actions/checkout@v7

      - name: Start Mosquitto
        uses: namoshek/mosquitto-github-action@v1
        with:
          ports: '1883:1883'
          config: ${{ github.workspace }}/.github/mosquitto/mosquitto.conf

      - name: Get Host IP
        run: |
          HOSTNAME=$(hostname -I | awk '{print $1}')
          echo "HOSTNAME=$HOSTNAME" >> $GITHUB_ENV

      - name: Restore ccache cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.ESP_IDF_VERSION }}-${{ env.TEST_TARGET }}-e2e-test-${{ github.run_id }}
          restore-keys: ccache-${{ env.ESP_IDF_VERSION }}-${{ env.TEST_TARGET }}-e2e-test-

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: ${{ env.TEST_TARGET }}
          path: test/e2e-tests
          extra_docker_args: >-
            -v ${{ env.CCACHE_DIR }}:/root/.ccache
            -e IDF_CCACHE_ENABLE=1
            -e CCACHE_COMPILERCHECK=content
          command: |
            ccache --max-size=${{ env.CCACHE_MAXSIZE }} --zero-stats
            echo "::group::idf.py build"
            idf.py -DUD_GEN=MK6_REV3 -DUD_DEBUG=1 -DWOKWI=1 -DWOKWI_MQTT_HOST=${{ env.HOSTNAME }} build
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then exit $rc; fi
            ccache -s

      - name: Install wokwi-cli
        run: curl -fsSL https://wokwi.com/ci/install.sh | sh

      - name: Compile Wokwi custom chips
        run: |
          for c in wokwi/chips/*.chip.c; do
            wokwi-cli chip compile "$c" -o "${c%.chip.c}.chip.wasm"
          done

      - name: Run a Wokwi CI server
        uses: wokwi/wokwi-ci-server-action@v1

      - name: Test with Wokwi
        uses: wokwi/wokwi-ci-action@v1
        if: false # Temporarily disabled
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: test/e2e-tests
          timeout: 30000
          expect_text: 'Device ready'
          serial_log_file: 'log-hello-world.txt'

      # - name: esp-idf test
      #   run: |
      #     docker run -v .:/project -w /project/test/e2e-tests -e HOME=/tmp -e WOKWI_CLI_TOKEN=${{ secrets.WOKWI_CLI_TOKEN }} lptr/pytest-embedded:latest pytest --embedded-services idf,wokwi ./pytest_e2e-tests.py

  r2-publish:
    name: Publish OTA to Cloudflare R2
    needs:
      - build
    runs-on: ubuntu-latest
    concurrency:
      group: publish-ota-r2
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: work/artifacts

      - name: Install dependencies
        working-directory: .github/publish-ota-r2
        run: npm ci

      - name: Run publisher
        working-directory: .github/publish-ota-r2
        run: |
          npx tsx publish-ota-r2.ts \
            --artifacts ../../work/artifacts \
            --repo-root ../.. \
            --base-url "${{ vars.R2_PUBLIC_URL }}" \
            --branch "${{ github.ref_name }}" \
            --commit-sha "${{ github.sha }}" \
            --keep-snapshot "0.32.13-27-g1b7a43e:Used in testing crash reports"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}

  release:
    needs:
      - build
      - unit-test
      - embedded-test
      - e2e-test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: work/artifacts

      - name: Display structure of downloaded files
        run: ls -R

      - name: Release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            work/artifacts/ugly-duckling-*/* \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
